[package]
name = "sift"
version = "0.1.0"
edition = "2021"
description = "Blazing-fast duplicate finder and fuzzy file search engine"

[dependencies]
clap = { version = "4", features = ["derive"] }
rayon = "1"
walkdir = "2"
blake3 = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
nucleo-matcher = "0.3"
